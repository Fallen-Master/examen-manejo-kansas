<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen de Manejo de Kansas — Práctica</title>
<meta name="description" content="Práctica gratuita para el examen escrito de manejo de Kansas, en español e inglés.">
<!-- El sitio ya es bilingüe: evitamos que el navegador lo traduzca por su cuenta -->
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<style>
  :root{
    --azul:#1a3a6b; --azul-claro:#2d5aa0; --amarillo:#f5b301;
    --verde:#1e7d43; --rojo:#c0392b; --fondo:#f4f6fa; --blanco:#fff;
    --gris:#5a6472; --borde:#d7dde6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI', Arial, sans-serif; background:var(--fondo); color:#222; font-size:19px; line-height:1.5;}
  header{background:var(--azul); color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  header h1{font-size:1.3rem; font-weight:600;}
  .lang-btn{background:var(--amarillo); color:#222; border:none; border-radius:24px; padding:10px 20px; font-size:1rem; font-weight:700; cursor:pointer;}
  .lang-btn:hover{filter:brightness(1.08);}
  main{max-width:760px; margin:0 auto; padding:24px 16px 60px;}
  .card{background:var(--blanco); border:1px solid var(--borde); border-radius:14px; padding:24px; margin-bottom:18px; box-shadow:0 2px 6px rgba(0,0,0,.05);}
  .hidden{display:none !important;}
  .btn{display:block; width:100%; border:none; border-radius:12px; padding:18px; font-size:1.15rem; font-weight:700; cursor:pointer; margin-top:14px;}
  .btn-primary{background:var(--azul-claro); color:#fff;}
  .btn-primary:hover{background:var(--azul);}
  .btn-green{background:var(--verde); color:#fff;}
  .btn-outline{background:#fff; color:var(--azul); border:2px solid var(--azul-claro);}
  .subtitle{color:var(--gris); margin-top:6px;}
  .facts{display:flex; gap:12px; margin-top:16px; flex-wrap:wrap;}
  .fact{flex:1; min-width:140px; background:var(--fondo); border-radius:10px; padding:12px; text-align:center;}
  .fact b{display:block; font-size:1.5rem; color:var(--azul);}
  /* question */
  .progress-wrap{background:#e2e7ef; border-radius:8px; height:14px; margin-bottom:8px; overflow:hidden;}
  .progress-bar{height:100%; background:var(--verde); width:0%; transition:width .3s;}
  .q-count{color:var(--gris); font-size:.95rem; margin-bottom:12px;}
  .sign-box{text-align:center; margin:10px 0 16px;}
  .sign-box svg{width:130px; height:130px;}
  .diagram svg{width:min(280px,80vw); height:auto; border-radius:12px; border:1px solid var(--borde);}
  .leyenda{display:flex; gap:16px; justify-content:center; margin-top:8px; font-size:.9rem; color:var(--gris);}
  .leyenda i{display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:5px; vertical-align:-2px;}
  .q-text{font-size:1.25rem; font-weight:700; margin-bottom:16px;}
  .opt{display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--borde); border-radius:12px; padding:16px; font-size:1.1rem; cursor:pointer; margin-bottom:10px; transition:background .15s;}
  .opt:hover{background:#eef2f8;}
  .opt.correct{background:#e3f4e9; border-color:var(--verde); font-weight:700;}
  .opt.wrong{background:#fdecea; border-color:var(--rojo);}
  .opt:disabled{cursor:default; opacity:1; color:#222; -webkit-text-fill-color:#222;}
  .opt.correct:disabled{color:#14532d; -webkit-text-fill-color:#14532d;}
  .opt.wrong:disabled{color:#7f1d1d; -webkit-text-fill-color:#7f1d1d;}
  .explanation{background:#fff8e1; border-left:5px solid var(--amarillo); border-radius:8px; padding:14px; margin-top:6px;}
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .chip{border:2px solid var(--azul-claro); background:#fff; color:var(--azul); border-radius:20px; padding:8px 16px; cursor:pointer; font-size:.95rem; font-weight:600;}
  .chip.active{background:var(--azul-claro); color:#fff;}
  .result-big{font-size:3rem; font-weight:800; text-align:center;}
  .pass{color:var(--verde);} .fail{color:var(--rojo);}
  .result-msg{text-align:center; font-size:1.3rem; margin-top:8px;}
  .review-item{border-top:1px solid var(--borde); padding:14px 0;}
  .review-item .rq{font-weight:700;}
  .review-item .ra{color:var(--verde); font-weight:600;}
  .review-item .rw{color:var(--rojo);}
  /* memes */
  /* caja 4:3 con el truco de padding: funciona en todos los teléfonos, incluso iOS viejo */
  .meme{position:relative; width:100%; max-width:480px; margin:0 auto 16px; padding-top:75%;
    background:#e8edf5; border-radius:14px; overflow:hidden;}
  .meme img{position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:block;}
  .meme-txt{position:absolute; left:0; right:0; text-align:center; font-family:Impact,'Arial Black',sans-serif;
    color:#fff; text-transform:uppercase; font-size:clamp(1.05rem, 5.2vw, 1.7rem); line-height:1.15;
    padding:0 8px; letter-spacing:.5px;
    text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 3px 6px rgba(0,0,0,.6);}
  .meme-top{top:8px;} .meme-bottom{bottom:10px;}
  .role-btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
  .role-btn{flex:1; min-width:170px; border:2px solid var(--azul-claro); background:#fff; color:var(--azul);
    border-radius:12px; padding:14px; font-size:1.05rem; font-weight:700; cursor:pointer;}
  .role-btn.active{background:var(--azul-claro); color:#fff;}
  .modal{position:fixed; inset:0; background:rgba(10,20,40,.75); display:flex; align-items:center;
    justify-content:center; padding:16px; z-index:50;}
  .modal-card{background:#fff; border-radius:16px; padding:20px; max-width:520px; width:100%;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .link-btn{background:none; border:none; color:var(--azul-claro); font-size:1rem; cursor:pointer; text-decoration:underline; padding:6px;}
  footer{text-align:center; color:var(--gris); font-size:.85rem; padding:20px; max-width:760px; margin:0 auto;}
</style>
</head>
<body class="notranslate" translate="no">
<header>
  <h1 id="app-title">🚗 Examen de Manejo de Kansas</h1>
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button>
</header>

<main>
  <!-- HOME -->
  <section id="screen-home">
    <div class="card">
      <h3 data-i18n="roleQ"></h3>
      <div class="role-btns">
        <button class="role-btn" id="roleSuegro" onclick="setRole('suegro')" data-i18n="roleSuegro"></button>
        <button class="role-btn" id="roleSuegra" onclick="setRole('suegra')" data-i18n="roleSuegra"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="welcome"></h2>
      <p class="subtitle" data-i18n="welcomeSub"></p>
      <div class="facts">
        <div class="fact"><b>25</b><span data-i18n="factQuestions"></span></div>
        <div class="fact"><b>80%</b><span data-i18n="factPass"></span></div>
        <div class="fact"><b>5</b><span data-i18n="factErrors"></span></div>
      </div>
    </div>
    <div class="card">
      <h3 data-i18n="studyTitle"></h3>
      <p class="subtitle" data-i18n="studyDesc"></p>
      <button class="btn btn-primary" onclick="startStudy()" data-i18n="studyBtn"></button>
    </div>
    <div class="card">
      <h3 data-i18n="examTitle"></h3>
      <p class="subtitle" data-i18n="examDesc"></p>
      <button class="btn btn-green" onclick="startExam()" data-i18n="examBtn"></button>
    </div>
  </section>

  <!-- QUIZ (shared by study & exam) -->
  <section id="screen-quiz" class="hidden">
    <div class="topbar">
      <button class="link-btn" onclick="goHome()" data-i18n="backHome"></button>
      <span class="q-count" id="qCount"></span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="card">
      <div class="filters hidden" id="filterBar"></div>
      <div class="sign-box" id="signBox"></div>
      <div class="q-text" id="qText"></div>
      <div id="optList"></div>
      <div class="explanation hidden" id="expBox"></div>
      <button class="btn btn-primary hidden" id="nextBtn" onclick="nextQuestion()"></button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="screen-results" class="hidden">
    <div class="card">
      <div class="meme" id="resultMeme">
        <img id="memeImg" alt="">
        <div class="meme-txt meme-top" id="memeTop"></div>
        <div class="meme-txt meme-bottom" id="memeBottom"></div>
      </div>
      <div class="result-big" id="resultScore"></div>
      <div class="result-msg" id="resultMsg"></div>
      <button class="btn btn-green" onclick="startExam()" data-i18n="tryAgain"></button>
      <button class="btn btn-outline" onclick="goHome()" data-i18n="backHome2"></button>
    </div>
    <div class="card hidden" id="reviewCard">
      <h3 data-i18n="reviewTitle"></h3>
      <div id="reviewList"></div>
    </div>
  </section>
</main>

<!-- CHEER MODAL (study mode) -->
<div class="modal hidden" id="cheerModal">
  <div class="modal-card">
    <div class="meme">
      <img id="cheerImg" alt="">
      <div class="meme-txt meme-top" id="cheerTop"></div>
      <div class="meme-txt meme-bottom" id="cheerBottom"></div>
    </div>
    <button class="btn btn-green" onclick="closeCheer()" data-i18n="continueBtn"></button>
  </div>
</div>

<footer id="footerText"></footer>

<script src="questions.js?v=3"></script>
<script src="memes.js?v=3"></script>
<script src="diagramas.js?v=1"></script>
<script src="situaciones.js?v=1"></script>

// Official MUTCD sign images (US government works — public domain), served from Wikimedia Commons.
// If an image fails to load, the inline SVG above is used as fallback.
const SIGN_IMG = {
  stop:"MUTCD_R1-1.svg",
  yield:"MUTCD_R1-2.svg",
  noentry:"MUTCD_R5-1.svg",
  oneway:"MUTCD_R6-1R.svg",
  wrongway:"MUTCD_R5-1a.svg",
  keepright:"MUTCD_R4-7.svg",
  noturnonred:"MUTCD_R10-11.svg",
  nouturn:"MUTCD_R3-4.svg",
  speed:"MUTCD_R2-1.svg",
  railroad:"MUTCD_W10-1.svg",
  school:"MUTCD_S1-1.svg",
  pennant:"MUTCD_W14-3.svg",
  merge:"MUTCD_W4-1.svg",
  curve:"MUTCD_W1-2.svg",
  crossroad:"MUTCD_W2-1.svg",
  signalahead:"MUTCD_W3-3.svg",
  stopahead:"MUTCD_W3-1.svg",
  hospital:"MUTCD_D9-2.svg",
  slowmoving:"MUTCD_SMV.svg"
};
function signHTML(key){
  const fallback = SIGNS[key] || "";
  if(SIGN_IMG[key]){
    const url = "https://commons.wikimedia.org/wiki/Special:FilePath/" + SIGN_IMG[key];
    const fb = encodeURIComponent(fallback);
    return `<img src="${url}" alt="road sign" style="width:130px;height:130px;object-fit:contain"
      onerror="this.outerHTML=decodeURIComponent('${fb}')">`;
  }
  return fallback;
}

function diagramHTML(key){
  const d = (typeof DIAGRAMAS !== "undefined") ? DIAGRAMAS[key] : null;
  if(!d) return "";
  return `<div class="diagram">${d}<div class="leyenda">
    <span><i style="background:#2d6fd8"></i>${t("legendYou")}</span>
    <span><i style="background:#e8762c"></i>${t("legendOther")}</span></div></div>`;
}

// ---------- Memes de Rafa (banco en memes.js) ----------
// unimos las preguntas de situaciones al banco principal
// (push, no reasignación: QUESTIONS es const)
if (typeof SITUACIONES !== "undefined") QUESTIONS.push(...SITUACIONES);

const CHEER_EVERY = 12; // study mode: meme every N questions
const BANKS = {pass: MEME_PASS, fail: MEME_FAIL, cheer: MEME_CHEER};
let lastMeme = {};      // avoid repeating the same image twice in a row

// Devuelve {img, top, bottom} eligiendo al azar del banco
function pickMeme(kind){
  const bank = BANKS[kind];
  let m = bank[Math.floor(Math.random() * bank.length)];
  if(bank.length > 1 && m.img === lastMeme[kind]){
    m = bank[(bank.indexOf(m) + 1) % bank.length];
  }
  lastMeme[kind] = m.img;
  // concordancia de género: %S suegro/a · %B abuelo/a · %P papá/mamá
  //                          %O terminación o/a · %C campeón/a · %E ese/esa
  const f = role === "suegra";                       // sin rol elegido = masculino
  const line = s => s
    .replace(/%S/g, f ? "SUEGRA" : "SUEGRO")
    .replace(/%B/g, lang === "es" ? (f ? "ABUELA" : "ABUELO")
                                  : (f ? "GRANDMA" : "GRANDPA"))
    .replace(/%P/g, lang === "es" ? (f ? "MAMÁ" : "PAPÁ")
                                  : (f ? "MOM" : "DAD"))
    .replace(/%O/g, f ? "A" : "O")
    .replace(/%C/g, f ? "CAMPEONA" : "CAMPEÓN")
    .replace(/%E/g, f ? "ESA" : "ESE");
  const txt = m[lang] || m.es;
  return {img: "img/" + m.img, top: line(txt[0]), bottom: line(txt[1])};
}

// Coloca un meme en pantalla. Siempre vuelve a mostrar la imagen:
// nunca dejamos un display:none pegado de una carga anterior.
function showMeme(imgId, topId, bottomId, m){
  const img = document.getElementById(imgId);
  img.style.display = "";                       // reset
  img.onerror = () => { img.style.display = "none"; };
  img.onload  = () => { img.style.display = ""; };
  img.src = m.img;
  document.getElementById(topId).textContent = m.top;
  document.getElementById(bottomId).textContent = m.bottom;
}

// ---------- State ----------
let role = localStorage.getItem("role") || null;
let lang = localStorage.getItem("lang") || "es";

function setRole(r){
  role = r;
  localStorage.setItem("role", r);
  updateRoleButtons();
}
function updateRoleButtons(){
  const a = document.getElementById("roleSuegro"), b = document.getElementById("roleSuegra");
  if(a) a.classList.toggle("active", role === "suegro");
  if(b) b.classList.toggle("active", role === "suegra");
}
let mode = null;            // "study" | "exam"
let quizList = [];          // questions in play
let idx = 0;
let answers = [];           // {q, chosenText, correctText, ok}
let studyFilter = "all";

function t(key){ return I18N[lang][key]; }

function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById("app-title").textContent = t("title");
  document.getElementById("langBtn").textContent = lang === "es" ? "English" : "Español";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.getElementById("footerText").textContent = t("footer");
  if(!document.getElementById("screen-quiz").classList.contains("hidden")) renderQuestion(false);
}

function toggleLang(){
  lang = lang === "es" ? "en" : "es";
  localStorage.setItem("lang", lang);
  applyLang();
}

function show(id){
  ["screen-home","screen-quiz","screen-results"].forEach(s =>
    document.getElementById(s).classList.toggle("hidden", s !== id));
  window.scrollTo(0,0);
}

function goHome(){ show("screen-home"); }

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- Study mode ----------
function startStudy(){
  mode = "study";
  buildFilterBar();
  setStudyFilter("all");
  show("screen-quiz");
}

function buildFilterBar(){
  const bar = document.getElementById("filterBar");
  bar.classList.remove("hidden");
  bar.innerHTML = "";
  ["all","situaciones","senales","reglas","seguridad","alcohol"].forEach(cat => {
    const b = document.createElement("button");
    b.className = "chip" + (cat === studyFilter ? " active" : "");
    b.textContent = t(cat === "all" ? "all" : cat);
    b.onclick = () => setStudyFilter(cat);
    bar.appendChild(b);
  });
}

function setStudyFilter(cat){
  studyFilter = cat;
  quizList = cat === "all" ? shuffle(QUESTIONS) : shuffle(QUESTIONS.filter(q => q.cat === cat));
  idx = 0; answers = [];
  buildFilterBar();
  renderQuestion(true);
}

// ---------- Exam mode ----------
function startExam(){
  mode = "exam";
  document.getElementById("filterBar").classList.add("hidden");
  quizList = shuffle(QUESTIONS).slice(0, 25);
  idx = 0; answers = [];
  show("screen-quiz");
  renderQuestion(true);
}

// ---------- Question rendering ----------
let currentOpts = [];   // shuffled option objects {text:{es,en}, ok}
let answered = false;

function renderQuestion(fresh){
  const q = quizList[idx];
  if(fresh){
    currentOpts = shuffle(q.opts.map((o, i) => ({o, ok: i === q.a})));
    answered = false;
  }
  document.getElementById("qCount").textContent = (idx + 1) + " " + t("ofQ") + " " + quizList.length;
  document.getElementById("progressBar").style.width = ((idx) / quizList.length * 100) + "%";
  document.getElementById("signBox").innerHTML = q.diag ? diagramHTML(q.diag) : (q.sign ? signHTML(q.sign) : "");
  document.getElementById("qText").textContent = q.q[lang];

  const list = document.getElementById("optList");
  list.innerHTML = "";
  currentOpts.forEach((co, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = co.o[lang];
    if(answered){
      b.disabled = true;
      if(co.ok) b.classList.add("correct");
      else if(answers[idx] && answers[idx].chosenIdx === i && !co.ok) b.classList.add("wrong");
    } else {
      b.onclick = () => selectAnswer(i);
    }
    list.appendChild(b);
  });

  const expBox = document.getElementById("expBox");
  const nextBtn = document.getElementById("nextBtn");
  if(answered && mode === "study"){
    expBox.classList.remove("hidden");
    const ok = answers[idx].ok;
    expBox.innerHTML = "<b>" + (ok ? "✅ " + t("correct") : "❌ " + t("incorrect")) + "</b> " + q.exp[lang];
  } else {
    expBox.classList.add("hidden");
  }
  nextBtn.textContent = (idx === quizList.length - 1) ? t("finish") : t("next");
  nextBtn.classList.toggle("hidden", !answered);
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const q = quizList[idx];
  const chosen = currentOpts[i];
  answers[idx] = {q, chosenIdx: i, chosen: chosen.o, ok: chosen.ok};
  if(mode === "study"){
    renderQuestion(false);
  } else {
    // exam: brief highlight then auto-advance feel — but keep manual Next for control
    renderExamFeedbackless(i);
  }
}

function renderExamFeedbackless(i){
  // In exam mode no correct/incorrect feedback until the end (like the real test)
  const list = document.getElementById("optList");
  Array.from(list.children).forEach((b, j) => {
    b.disabled = true;
    if(j === i){ b.style.borderColor = "var(--azul-claro)"; b.style.background = "#e8eef8"; b.style.fontWeight = "700"; }
  });
  document.getElementById("nextBtn").classList.remove("hidden");
}

function nextQuestion(){
  if(mode === "study" && (idx + 1) % CHEER_EVERY === 0 && idx < quizList.length - 1){
    showCheer();
  }
  if(idx < quizList.length - 1){
    idx++;
    renderQuestion(true);
  } else {
    if(mode === "exam") showResults();
    else showStudyDone();
  }
}

function showCheer(){
  showMeme("cheerImg", "cheerTop", "cheerBottom", pickMeme("cheer"));
  document.getElementById("cheerModal").classList.remove("hidden");
}
function closeCheer(){
  document.getElementById("cheerModal").classList.add("hidden");
}

function showStudyDone(){
  alert(t("studyDone"));
  goHome();
}

// ---------- Results ----------
function showResults(){
  const correct = answers.filter(a => a && a.ok).length;
  const passed = correct >= 20;
  // meme de Rafa (al azar del banco)
  showMeme("memeImg", "memeTop", "memeBottom", pickMeme(passed ? "pass" : "fail"));
  const scoreEl = document.getElementById("resultScore");
  scoreEl.textContent = correct + " / " + quizList.length;
  scoreEl.className = "result-big " + (passed ? "pass" : "fail");
  document.getElementById("resultMsg").textContent = passed ? t("passed") : t("failed");

  const wrong = answers.filter(a => a && !a.ok);
  const reviewCard = document.getElementById("reviewCard");
  const reviewList = document.getElementById("reviewList");
  reviewList.innerHTML = "";
  if(wrong.length){
    reviewCard.classList.remove("hidden");
    wrong.forEach(a => {
      const div = document.createElement("div");
      div.className = "review-item";
      const correctText = a.q.opts[a.q.a][lang];
      div.innerHTML = "<div class='rq'>" + a.q.q[lang] + "</div>" +
        "<div class='rw'>" + t("yourAnswer") + " " + a.chosen[lang] + "</div>" +
        "<div class='ra'>" + t("correctAnswer") + " " + correctText + "</div>" +
        "<div class='subtitle'>" + a.q.exp[lang] + "</div>";
      reviewList.appendChild(div);
    });
  } else {
    reviewCard.classList.add("hidden");
  }
  show("screen-results");
  applyLang();
}

// ---------- Init ----------
applyLang();
updateRoleButtons();
</script>
